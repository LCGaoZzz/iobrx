[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iobrx-harness"
version = "0.2.0"
description = "JSON CLI and Omicos Agent/Skill harness for iobrx"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["iobrx>=0.3.0,<0.4", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
h5ad = ["anndata>=0.11"]
mcp = ["mcp>=1.28,<2"]
test = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
iobrx-agent = "iobrx_harness.cli:main"
iobrx-agent-mcp = "iobrx_harness.mcp_server:main"

[project.urls]
Repository = "https://github.com/LCGaoZzz/iobrx"

[tool.setuptools.packages.find]
where = ["omicos/skills/iobrx/scripts"]
include = ["iobrx_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
