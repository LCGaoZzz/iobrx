name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build wheel and install (maturin source build)
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Smoke tests
        # The Rust extension unconditionally compiles its argsort path for
        # the AVX-512 kernel numpy dispatches (bit-exactness contract, see
        # README "Install"). On runners whose CPU lacks AVX-512 the tests
        # would die with SIGILL, so gate on CPU flags: build + install are
        # always verified; tests run whenever the runner has the ISA.
        run: |
          model="$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          echo "Runner CPU: ${model:-unknown}"
          if grep -qm1 avx512f /proc/cpuinfo; then
            pytest -q
          else
            echo "::warning::Runner CPU lacks AVX-512 — smoke tests skipped."
            echo "The iobrx extension targets the AVX-512 argsort kernel by"
            echo "design (bit-exactness contract). Wheel build and install were"
            echo "verified above; run pytest on AVX-512 hardware."
          fi
