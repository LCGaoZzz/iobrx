name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      IOBRX_TESTDATA: ${{ github.workspace }}/tutorials/data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build wheel and install (maturin source build)
        run: |
          python -m pip install --upgrade pip
          pip install -c tests/constraints-validated.txt .[test]

      - name: Smoke and CPU portability tests (every runner)
        run: python -m pytest -q

      - name: Official-data numerical parity (offline fixtures)
        env:
          IOBRX_TME_PROFILE_SEQ: "1"
        run: python -m pytest -q -m full

      - name: Public API with native extension disabled
        env:
          IOBRX_DISABLE_RUST: "1"
        run: python -m pytest -q tests/test_api_smoke.py tests/test_workflow_reliability.py

      - name: Baseline NumPy sorting dispatch
        env:
          NPY_DISABLE_CPU_FEATURES: AVX2,FMA3,AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL
        run: python -m pytest -q tests/test_portability.py -k 'quantile or argsort'

      - name: Verify committed tutorials and data integrity
        run: python scripts/validate_tutorials.py
