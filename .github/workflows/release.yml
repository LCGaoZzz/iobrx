name: Release

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check version and release ancestry
        run: |
          python scripts/check_release.py --source
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
            test "$GITHUB_REF_NAME" = "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
      - name: Build portable Linux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: "1.15.0"
          target: x86_64-unknown-linux-gnu
          manylinux: "2014"
          args: --release --locked --interpreter python3.11 --out dist
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: "1.15.0"
          command: sdist
          args: --manifest-path rust/Cargo.toml --out dist
      - name: Check archives and PyPI metadata
        run: |
          python scripts/check_release.py --dist dist
          python -m pip install twine
          python -m twine check --strict dist/*
      - name: Install exclusively from binary wheels
        run: |
          python -m venv /tmp/iobrx-release
          /tmp/iobrx-release/bin/python -m pip install --upgrade pip
          /tmp/iobrx-release/bin/python -m pip install --only-binary=:all: dist/*.whl pytest==9.1.1
          /tmp/iobrx-release/bin/python -m pip check
          /tmp/iobrx-release/bin/python scripts/check_release.py --installed
      - name: Numerical parity and CPU portability of installed wheel
        env:
          IOBRX_TESTDATA: ${{ github.workspace }}/tutorials/data
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          /tmp/iobrx-release/bin/python -m pytest -q -m ''
          IOBRX_DISABLE_RUST=1 /tmp/iobrx-release/bin/python -m pytest -q tests/test_api_smoke.py
          NPY_DISABLE_CPU_FEATURES=AVX2,FMA3,AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL /tmp/iobrx-release/bin/python -m pytest -q tests/test_portability.py -k 'quantile or argsort'
      - name: Rebuild from the source archive
        run: |
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir /tmp/sdist-rebuilt
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  container:
    needs: distributions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Build the versioned runtime
        run: |
          docker build --pull --build-arg REVISION="$GITHUB_SHA" -t iobrx:verify .
      - name: Check the runtime as its non-root user
        run: |
          docker run --rm iobrx:verify
          docker run --rm iobrx:verify python -m pip check
          docker run --rm -v "$PWD/scripts:/checks:ro" iobrx:verify python /checks/check_release.py --installed
      - name: Run parity and portability inside the container
        run: |
          docker run --rm --user 0 -e IOBRX_TESTDATA=/repo/tutorials/data -e OMP_NUM_THREADS=2 -e OPENBLAS_NUM_THREADS=2 -v "$PWD:/repo:ro" -w /repo iobrx:verify sh -ec 'python -m pip install --only-binary=:all: pytest==9.1.1; python -m pytest -q -m "" -p no:cacheprovider'
      - name: Publish the tested container
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag iobrx:verify "$image:$version"
          docker push "$image:$version"
          docker inspect --format='{{index .RepoDigests 0}}' "$image:$version" > container-digest.txt
          docker logout ghcr.io
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: container-digest
          path: container-digest.txt

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [distributions, container]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/iobrx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pypi, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: container-digest
          path: dist
      - name: Publish release assets and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum *.whl *.tar.gz container-digest.txt > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "iobrx $GITHUB_REF_NAME" --notes-file docs/releases/0.2.0.md
