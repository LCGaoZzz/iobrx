[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "iobrx"
version = "0.4.0"
description = "Accelerated IOBRpy workflows with a pandas API, Rust kernels and scoped numerical parity validation"
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE", "rust/vendor/THIRD_PARTY_NOTICES.md", "rust/vendor/LICENSE.*"]
authors = [{ name = "iobrx contributors" }]
requires-python = ">=3.11"
keywords = ["bioinformatics", "deconvolution", "cibersort", "ssgsea", "iobr", "tumor-microenvironment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # Reference data for the bundled kernels ships inside the wheel
    # (src/iobrx/_resources/NOTICE.md); IOBRpy itself is demoted to the
    # optional `python` extra (Python fallback backend + parity tests).
    # Ranges below let iobrx coexist with shared environments such as the
    # Omicos kernel. The EXACT validated numerical versions are published
    # as the `strict` extra and remain what the official bit-exact parity
    # gates and CI assert (see docs/PORTABILITY.md and
    # tests/constraints-validated.txt).
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "scipy>=1.16,<2",
    # The vendored libsvm kernel is scikit-learn 1.7.2's svm.cpp; newer
    # versions keep CIBERSORT numerics on the validated fixture, but only
    # 1.7.x is asserted bit-exact (install `iobrx[strict]` for the gates).
    "scikit-learn>=1.7,<2",
    "gseapy>=1.3,<2",
    "joblib>=1.3",
    "pyarrow>=20,<21",
    "pyreadr>=0.5.6,<0.6",
]

[project.optional-dependencies]
# Python fallback backend, quanTIseq and signature scoring (which reuse
# upstream IOBRpy modules) and the official parity tests.
python = ["iobrpy==0.2.1"]
# The exact numerical versions the official bit-exact parity gates are run
# on; see tests/constraints-validated.txt.
strict = [
    "numpy==2.2.6",
    "scipy==1.16.3",
    "scikit-learn==1.7.2",
    "gseapy==1.3.1",
]
# The parity gates compare the accelerated paths against the ORIGINAL
# implementation, so the test extra includes the Python fallback package.
test = ["pytest>=7.0", "iobrpy==0.2.1"]
tutorials = ["matplotlib>=3.7", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6", "jupyterlab>=4"]

[project.urls]
Homepage = "https://github.com/LCGaoZzz/iobrx"
Repository = "https://github.com/LCGaoZzz/iobrx"
Issues = "https://github.com/LCGaoZzz/iobrx/issues"
Changelog = "https://github.com/LCGaoZzz/iobrx/blob/main/CHANGELOG.md"
Benchmarks = "https://github.com/LCGaoZzz/iobrx/blob/main/BENCHMARKS.md"

# Hybrid Python + Rust build.
# - The Rust cdylib installs as the extension submodule `iobrx._rust`
#   (module-name below; the `#[pymodule] fn _rust` in lib.rs matches the
#   trailing component, as pyo3 requires). For compatibility with the
#   historical top-level name, `import iobrx` registers the alias
#   `sys.modules["iobrx_rust"]`, so `import iobrx_rust` keeps working once
#   iobrx has been imported; documented in README.md ("The Rust extension
#   module").
# - `python-source = "src"` -> pure-Python part lives in src/iobrx/.
[tool.maturin]
python-source = "src"
manifest-path = "rust/Cargo.toml"
module-name = "iobrx._rust"
include = [
    { path = "rust/vendor/**", format = "sdist" },
    { path = "rust/src/**", format = "sdist" },
]

[tool.pytest.ini_options]
# Default run = synthetic smoke and portability tests: the 11 official parity
# gates are marked `full` and need the official data (IOBRX_TESTDATA or a
# mirror download), so they are deselected by default. Opt in explicitly
# with `pytest -m full` (or `pytest --run-full`, see tests/conftest.py);
# a command-line -m overrides this addopts value.
addopts = "-m 'not full'"
markers = ["full: official-data parity gates (download or IOBRX_TESTDATA; slow)"]
testpaths = ["tests"]
